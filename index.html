<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIPIN SHOP</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7ff;
      color: #172b4d;
    }
    header {
      background: #0757c9;
      color: white;
      padding: 22px;
      text-align: center;
    }
    header h1 { margin: 0; }
    nav {
      background: white;
      padding: 15px;
      text-align: center;
    }
    nav a {
      color: #0757c9;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }
    .hero {
      margin: 22px;
      padding: 35px 20px;
      background: #dceaff;
      border-radius: 16px;
      text-align: center;
    }
    .hero h2 { color: #0757c9; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .product {
      background: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 3px 12px #00000010;
    }
    .product button {
      background: #0757c9;
      color: white;
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
    }
    footer {
      background: #0757c9;
      color: white;
      text-align: center;
      padding: 18px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ARIPIN SHOP</h1>
    <p>Belanja mudah, aman, dan terpercaya</p>
  </header>

  <nav>
    <a href="#beranda">Beranda</a>
    <a href="#produk">Produk</a>
    <a href="#kontak">Kontak</a>
  </nav>

  <section class="hero" id="beranda">
    <h2>Selamat Datang di ARIPIN SHOP</h2>
    <p>Temukan produk pilihan dengan mudah.</p>
  </section>

  <h2 style="text-align:center">Produk Kami</h2>
  <section class="products" id="produk">
    <div class="product">
      <h3>Produk 1</h3>
      <p>Segera hadir</p>
      <button onclick="alert('Produk belum tersedia')">Lihat Produk</button>
    </div>
    <div class="product">
      <h3>Produk 2</h3>
      <p>Segera hadir</p>
      <button onclick="alert('Produk belum tersedia')">Lihat Produk</button>
    </div>
  </section>

  <footer id="kontak">
    <p>ARIPIN SHOP © 2026</p>
    <p>Terima kasih sudah berkunjung!</p>
  </footer>
</body>
</html>
